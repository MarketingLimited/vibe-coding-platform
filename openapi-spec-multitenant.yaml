openapi: 3.1.0
info:
  title: Vibe Coding Platform - Multi-Tenant API
  version: 2.0.0
  description: |
    **منصة تطوير متعددة المستخدمين مع عزل تام**
    
    ## كيفية الاستخدام
    
    ### 1. إنشاء مشروع جديد (مرة واحدة)
    ```
    User: "أريد إنشاء مشروع Python جديد اسمه myapp"
    
    GPT → POST /projects/create
    {
      "username": "extracted_from_user",
      "project_name": "myapp",
      "project_type": "python",
      "project_template": "fastapi/basic",
      "github_api_key": "ghp_xxxxxxxxxxxxxxxxxxxxx",
      "additional_secrets": {
        "openai_api_key": "sk-xxxxx",
        "slack_webhook": "https://hooks.slack.com/..."
      }
    }
    
    Response: {
      "project_id": "user123-myapp",
      "password": "X7k2Pm9qs4Rt",
      "status": "ready"
    }
    
    GPT saves to memory:
      project_id: user123-myapp
      password: X7k2Pm9qs4Rt
    ```
    
    ### 2. العمل على المشروع
    ```
    User: "شغّل خادم FastAPI"
    
    GPT → POST /exec
    {
      "project_id": "user123-myapp",  # from memory
      "password": "X7k2Pm9qs4Rt",     # from memory
      "cmd": "uvicorn main:app --host 0.0.0.0 --port 8000"
    }
    ```
    
    ### 3. العودة للمشروع (جلسة جديدة)
    ```
    User: "أريد أكمل على مشروع myapp"
    
    GPT: "ما هو الباسورد للمشروع user123-myapp؟"
    
    User: "X7k2Pm9qs4Rt"
    
    GPT saves to memory and continues
    ```
    
    ## الأمان
    - كل مشروع له password فريد
    - عزل تام بين المشاريع
    - لا وصول خارجي مباشر
    - جميع الطلبات مسجلة

servers:
  - url: "{public_base_url}"
    description: خادم الإنتاج (يجب ضبطه على `API_PUBLIC_BASE_URL`)
    variables:
      public_base_url:
        default: https://api.example.com
        description: |
          اضبط المتغير إلى القيمة الكاملة لمتغير البيئة `API_PUBLIC_BASE_URL` (بما في ذلك https).

security:
  - masterKeyAuth: []

paths:
  /health:
    get:
      operationId: healthCheck
      summary: فحص صحة النظام
      tags: [System]
      security: []
      responses:
        '200':
          description: النظام يعمل بشكل صحيح
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  redis:
                    type: string
                  docker:
                    type: string
                  projects_count:
                    type: integer

  /health/services:
    get:
      operationId: healthServices
      summary: تفاصيل صحة الخدمات الداخلية وحدود المعدل
      tags: [System]
      security: []
      responses:
        '200':
          description: ملخص حالة Redis وSQLite وDocker وخدمة Project Manager.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: healthy أو degraded حسب حالة المكونات.
                  timestamp:
                    type: string
                  components:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
                  limits:
                    type: object
                    properties:
                      rate_window_seconds:
                        type: integer
                      exec_limit_per_minute:
                        type: integer
                      project_create_limit:
                        type: integer

  /projects/create:
    post:
      operationId: createProject
      summary: إنشاء مشروع جديد
      tags: [Projects]
      description: |
        ينشئ مشروع جديد للمستخدم.
        
        **مهم:**
        - اسأل المستخدم عن اسم المشروع
        - استخرج username من السياق
        - احفظ project_id و password في الذاكرة
        - أخبر المستخدم بحفظ الباسورد
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, project_name, project_type, github_api_key]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9_-]+$'
                  minLength: 3
                  maxLength: 50
                  description: اسم المستخدم (حروف صغيرة وأرقام فقط)
                project_name:
                  type: string
                  pattern: '^[a-z0-9_-]+$'
                  minLength: 3
                  maxLength: 50
                  description: اسم المشروع
                project_type:
                  type: string
                  enum: [python, nodejs, php, full]
                  description: نوع المشروع
                project_template:
                  type: string
                  description: اسم القالب أو البوكلت الجاهز (اختياري)
                  maxLength: 100
                database:
                  type: string
                  enum: [postgres, mysql, sqlite, none]
                  description: قاعدة بيانات (اختياري)
                redis:
                  type: boolean
                  default: false
                  description: تفعيل Redis
                github_api_key:
                  type: string
                  minLength: 20
                  description: مفتاح GitHub الشخصي (يحفظ مشفرًا)
                additional_secrets:
                  type: object
                  description: أسرار إضافية مرتبطة بالمشروع
                  additionalProperties:
                    type: string
            examples:
              python_simple:
                summary: مشروع Python بسيط
                value:
                  username: "ahmad"
                  project_name: "myapi"
                  project_type: "python"
                  project_template: "fastapi/basic"
                  github_api_key: "ghp_xxxxxxxxxxxxxxxxxxxxx"
                  additional_secrets:
                    openai_api_key: "sk-xxxxx"

              nodejs_with_db:
                summary: مشروع Node.js مع PostgreSQL
                value:
                  username: "sara"
                  project_name: "webapp"
                  project_type: "nodejs"
                  database: "postgres"
                  github_api_key: "ghp_yyyyyyyyyyyyyyyyyyyy"
                  additional_secrets: {}

              php_laravel:
                summary: مشروع PHP Laravel
                value:
                  username: "khalid"
                  project_name: "shop"
                  project_type: "php"
                  database: "mysql"
                  project_template: "laravel/ecommerce"
                  github_api_key: "ghp_zzzzzzzzzzzzzzzzzzzz"
                  additional_secrets:
                    stripe_secret: "sk-live-123"
      
      responses:
        '200':
          description: تم إنشاء المشروع بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    description: معرف المشروع الفريد
                  password:
                    type: string
                    description: باسورد المشروع (احفظه!)
                  status:
                    type: string
                  container_id:
                    type: string
                  preview_url:
                    type: string
                    description: رابط المعاينة المباشر (https://{project}.kazaaz.com)
                    nullable: true
                  message:
                    type: string
              example:
                project_id: "ahmad-myapi"
                password: "X7k2Pm9qs4Rt8vLn"
                status: "ready"
                container_id: "abc123def456"
                preview_url: "https://ahmad-myapi.kazaaz.com"
                message: "Save this password! It won't be shown again."

  /exec:
    post:
      operationId: executeCommand
      summary: تنفيذ أمر في المشروع
      tags: [Execution]
      security: []
      description: |
        ينفذ أمر shell داخل حاوية المشروع.
        
        **متطلبات:**
        - project_id (من الذاكرة)
        - password (من الذاكرة)
        - cmd (الأمر المطلوب)
        
        **إذا لم يكن project_id في الذاكرة:**
        اسأل المستخدم: "ما هو معرف مشروعك؟"
        
        **إذا لم يكن password في الذاكرة:**
        اسأل المستخدم: "ما هو باسورد المشروع؟"
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, password, cmd]
              properties:
                project_id:
                  type: string
                  description: معرف المشروع
                password:
                  type: string
                  description: باسورد المشروع
                cmd:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: الأمر المطلوب تنفيذه
                cwd:
                  type: string
                  default: /workspace
                  description: مسار العمل
                timeout:
                  type: integer
                  minimum: 1
                  maximum: 300
                  default: 300
                  description: المهلة الزمنية (ثواني)
            
            examples:
              check_python:
                summary: فحص نسخة Python
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  cmd: "python3 --version"
              
              install_deps:
                summary: تثبيت اعتماديات Python
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  cmd: "pip install fastapi uvicorn"
              
              run_server:
                summary: تشغيل خادم FastAPI
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  cmd: "uvicorn main:app --host 0.0.0.0 --port 8000"
                  timeout: 300
              
              run_tests:
                summary: تشغيل الاختبارات
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  cmd: "pytest -v"

  /git/commit:
    post:
      operationId: gitCommit
      summary: إنشاء التزام جديد مع نسخة احتياطية
      tags: [Git]
      security: []
      description: |
        ينفذ `git commit` داخل حاوية المشروع بعد إنشاء نسخة احتياطية كاملة من مساحة العمل.

        ⚠️ تذكير: يتم إنشاء مجلد نسخ احتياطي قبل أي تعديل لتسهيل التراجع لاحقًا.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitCommitRequest'
            examples:
              commit_all:
                summary: حفظ جميع التغييرات الحالية
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  message: "تحديث README وصفحة الهبوط"
                  add_all: true
      responses:
        '200':
          description: تفاصيل تنفيذ git commit مع مسار النسخة الاحتياطية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommandResponse'

  /git/log:
    post:
      operationId: gitLog
      summary: عرض سجل Git الأخير
      tags: [Git]
      security: []
      description: |
        ينفذ `git log` داخل حاوية المشروع مع التحكم بعدد السجلات وصيغة العرض.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitLogRequest'
            examples:
              recent_log:
                summary: عرض آخر 5 التزامات
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  limit: 5
                  format: "%h %ad %s"
      responses:
        '200':
          description: ناتج أمر git log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommandResponse'

  /git/reset:
    post:
      operationId: gitReset
      summary: التراجع إلى التزام سابق مع نسخة احتياطية
      tags: [Git]
      security: []
      description: |
        ينفذ `git reset` (افتراضيًا بوضع --hard) بعد إنشاء نسخة احتياطية من مساحة العمل.

        استخدم هذا المسار لاسترجاع حالة المشروع إلى التزام محدد بعد اكتشاف مشكلة.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitResetRequest'
            examples:
              rollback_example:
                summary: التراجع إلى التزام محدد
                value:
                  project_id: "ahmad-myapi"
                  password: "X7k2Pm9qs4Rt"
                  commit: "abc123def456"
                  hard: true
      responses:
        '200':
          description: نتيجة تنفيذ git reset مع موقع النسخة الاحتياطية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommandResponse'
      
      responses:
        '200':
          description: تم تنفيذ الأمر
          content:
            application/json:
              schema:
                type: object
                properties:
                  returncode:
                    type: integer
                  stdout:
                    type: string
                  stderr:
                    type: string
                  elapsed_seconds:
                    type: number

  /projects/info:
    post:
      operationId: getProjectInfo
      summary: معلومات المشروع
      tags: [Projects]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, password]
              properties:
                project_id:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: معلومات المشروع
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  username:
                    type: string
                  project_name:
                    type: string
                  project_type:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                  container_id:
                    type: string
                    nullable: true
                  database:
                    type: string
                  redis:
                    type: boolean
                  preview_url:
                    type: string
                    nullable: true
                    description: رابط المعاينة المباشر

  /projects/{username}:
    get:
      operationId: listUserProjects
      summary: قائمة مشاريع المستخدم
      tags: [Projects]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: قائمة المشاريع
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: string
                        username:
                          type: string
                        project_name:
                          type: string
                        project_type:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        status:
                          type: string
                        container_id:
                          type: string
                          nullable: true
                        database:
                          type: string
                        redis:
                          type: boolean
                        preview_url:
                          type: string
                          nullable: true
                          description: رابط المعاينة المباشر

components:
  securitySchemes:
    masterKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        مفتاح API الرئيسي (للعمليات الإدارية فقط)
        مثل إنشاء المشاريع وحذفها
  schemas:
    GitCommandResponse:
      type: object
      required: [returncode, stdout, stderr]
      properties:
        returncode:
          type: integer
          description: كود الخروج من أمر Git
        stdout:
          type: string
          description: ناتج المعيار stdout (قد يتم اقتطاعه)
        stderr:
          type: string
          description: ناتج المعيار stderr (قد يتم اقتطاعه)
        backup_path:
          type: string
          nullable: true
          description: مسار النسخة الاحتياطية التي تم إنشاؤها قبل تنفيذ الأمر
    GitCommitRequest:
      type: object
      required: [project_id, password, message]
      properties:
        project_id:
          type: string
          description: معرف المشروع المستهدف
        password:
          type: string
          description: كلمة مرور المشروع للتحقق من الهوية
        message:
          type: string
          minLength: 1
          description: رسالة الالتزام
        add_all:
          type: boolean
          default: true
          description: إضافة جميع الملفات تلقائيًا قبل الالتزام
        amend:
          type: boolean
          default: false
          description: تعديل الالتزام السابق بدلاً من إنشاء واحد جديد
        cwd:
          type: string
          default: /workspace
          description: مسار التنفيذ داخل الحاوية
        timeout:
          type: integer
          minimum: 1
          maximum: 300
          nullable: true
          description: مهلة التنفيذ بالثواني
        max_output_size:
          type: integer
          minimum: 1024
          nullable: true
          description: الحد الأقصى لحجم المخرجات (بايت)
    GitLogRequest:
      type: object
      required: [project_id, password]
      properties:
        project_id:
          type: string
        password:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: عدد السجلات المطلوب عرضها
        format:
          type: string
          nullable: true
          description: القيمة الممررة إلى `git log --pretty`
        cwd:
          type: string
          default: /workspace
        timeout:
          type: integer
          minimum: 1
          maximum: 300
          nullable: true
        max_output_size:
          type: integer
          minimum: 1024
          nullable: true
    GitResetRequest:
      type: object
      required: [project_id, password, commit]
      properties:
        project_id:
          type: string
        password:
          type: string
        commit:
          type: string
          minLength: 4
          description: معرف الالتزام المراد الرجوع إليه
        hard:
          type: boolean
          default: true
          description: استخدام reset --hard لحذف التغييرات المحلية
        cwd:
          type: string
          default: /workspace
        timeout:
          type: integer
          minimum: 1
          maximum: 300
          nullable: true
        max_output_size:
          type: integer
          minimum: 1024
          nullable: true

tags:
  - name: System
    description: معلومات النظام
  - name: Projects
    description: إدارة المشاريع
  - name: Execution
    description: تنفيذ الأوامر
  - name: Git
    description: إدارة مستودع Git داخل الحاوية مع نسخ احتياطية تلقائية
