version: "3.9"

# =============================================================================
# Vibe Coding Platform - Central System
# =============================================================================
# Multi-tenant API with project isolation
# Compatible with Plesk/Ubuntu 24
# =============================================================================

networks:
  vibe-network:
    external: true
    name: vibe-network

volumes:
  api_data:
    name: vibe_api_data
  projects_db:
    name: vibe_projects_db
  redis_data:
    name: vibe_redis_data

services:
  
  # ===========================================================================
  # Central API - Multi-tenant FastAPI
  # ===========================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: vibe-coding/api:latest
    container_name: vibe-api
    hostname: vibe-api
    restart: unless-stopped
    env_file:
      - ./config/.env

    environment:
      - API_PORT=${API_PORT:-9000}
      - API_KEY=${API_KEY}
      - API_HOST=${API_HOST:-0.0.0.0}
      - DOMAIN=${DOMAIN:-localhost}
      
      # Database
      - DB_TYPE=sqlite
      - DB_PATH=/data/projects.db
      - DB_PASSWORD=${DB_PASSWORD}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # Limits
      - MAX_PROJECTS_PER_USER=${MAX_PROJECTS_PER_USER:-10}
      - PROJECT_CPU_LIMIT=${PROJECT_CPU_LIMIT:-2.0}
      - PROJECT_MEMORY_LIMIT=${PROJECT_MEMORY_LIMIT:-4G}
      - PROJECT_STORAGE_LIMIT=${PROJECT_STORAGE_LIMIT:-10G}
      
      # Timeouts
      - EXEC_TIMEOUT=${EXEC_TIMEOUT:-300}
      - MAX_OUTPUT_SIZE=${MAX_OUTPUT_SIZE:-10485760}

      # Security
      - ENABLE_RATE_LIMIT=${ENABLE_RATE_LIMIT:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}

      # Internal services
      - PROJECT_MANAGER_HOST=project-manager
      - PROJECT_MANAGER_PORT=${PROJECT_MANAGER_PORT:-9400}
      - PROJECT_MANAGER_SCHEME=http

      # Paths
      - PROJECTS_DIR=/projects
      - LOGS_DIR=/logs
    
    ports:
      - "127.0.0.1:${API_PORT:-9000}:${API_PORT:-9000}"
    
    networks:
      - vibe-network
    
    volumes:
      - api_data:/data
      - projects_db:/db
      - ${DATA_DIR}/projects:/projects
      - ${DATA_DIR}/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    depends_on:
      - redis
      - project-manager
    
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-9000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    labels:
      - "com.vibe-coding.service=api"
      - "com.vibe-coding.version=2.0"
  
  # ===========================================================================
  # Project Manager - Container Orchestration
  # ===========================================================================
  project-manager:
    build:
      context: ./project-manager
      dockerfile: Dockerfile
    image: vibe-coding/project-manager:latest
    container_name: vibe-project-manager
    hostname: vibe-pm
    restart: unless-stopped
    env_file:
      - ./config/.env
    
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PROJECTS_DIR=/projects
      - NETWORK_NAME=vibe-network
      - IMAGE_PREFIX=vibe-project
      
      # Resource limits per project
      - DEFAULT_CPU_LIMIT=${PROJECT_CPU_LIMIT:-2.0}
      - DEFAULT_MEMORY_LIMIT=${PROJECT_MEMORY_LIMIT:-4G}
      - DEFAULT_STORAGE_LIMIT=${PROJECT_STORAGE_LIMIT:-10G}

      # Cleanup
      - AUTO_CLEANUP_DAYS=30
      - CLEANUP_INACTIVE_PROJECTS=true
      - TEMPLATES_DIR=/templates

      # API integration
      - PROJECT_MANAGER_PORT=${PROJECT_MANAGER_PORT:-9400}

    networks:
      - vibe-network

    volumes:
      - ${DATA_DIR}/projects:/projects
      - ${DATA_DIR}/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
    
    privileged: false
    
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    labels:
      - "com.vibe-coding.service=project-manager"
      - "com.vibe-coding.version=2.0"
  
  # ===========================================================================
  # Redis - Cache & Session Storage
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: vibe-redis
    hostname: vibe-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    
    networks:
      - vibe-network
    
    volumes:
      - redis_data:/data
    
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    
    labels:
      - "com.vibe-coding.service=redis"
      - "com.vibe-coding.version=2.0"
  
  # ===========================================================================
  # Cleanup Service - Automatic Maintenance
  # ===========================================================================
  cleanup:
    build:
      context: ./cleanup
      dockerfile: Dockerfile
    image: vibe-coding/cleanup:latest
    container_name: vibe-cleanup
    restart: unless-stopped
    env_file:
      - ./config/.env
    
    environment:
      - CLEANUP_INTERVAL=86400  # 24 hours
      - MAX_PROJECT_AGE_DAYS=30
      - MAX_LOG_SIZE_MB=100
      - DOCKER_HOST=unix:///var/run/docker.sock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

    networks:
      - vibe-network
    
    volumes:
      - ${DATA_DIR}/projects:/projects
      - ${DATA_DIR}/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    
    labels:
      - "com.vibe-coding.service=cleanup"
      - "com.vibe-coding.version=2.0"
