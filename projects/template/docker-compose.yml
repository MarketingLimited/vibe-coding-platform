version: "3.9"

# =============================================================================
# Vibe Coding Platform - Project Docker Compose
# Template for creating isolated development environments
# =============================================================================

# Shared environment variables
x-common-env: &common-env
  PUID: 1000
  PGID: 1000
  TZ: Asia/Bahrain
  WORKSPACE: /workspace
  
  # API Settings
  EXEC_TIMEOUT_SECONDS: 90
  EXEC_MAX_OUTPUT: 5242880  # 5MB
  EXEC_RATE_LIMIT: 100
  
  # Security
  EXEC_ALLOWLIST: "bash,sh,python3,pip,node,npm,pnpm,yarn,go,cargo,rustc,javac,java,git,make,jq,rg,grep,find,tree,ls,cat,head,tail,wc,docker,docker-compose,psql,mysql,sqlite3,php,composer,artisan"
  
  # Code Server
  PASSWORD: ${CODE_SERVER_PASSWORD}
  SUDO_PASSWORD: ${CODE_SERVER_PASSWORD}
  
  # SSH
  SSH_PASSWORD: ${SSH_PASSWORD}

# Resource limits template
x-resources: &resources
  cpus: '2.0'
  memory: 4G
  pids: 100

# Logging template
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"
    labels: "project,service"

# =============================================================================
# Networks
# =============================================================================
networks:
  edge:
    external: true
    name: edge
  
  project_net:
    name: ${PROJECT_NAME}_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.${SUBNET_OCTET}.0.0/24

# =============================================================================
# Volumes
# =============================================================================
volumes:
  workspace:
    name: ${PROJECT_NAME}_workspace
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/workspace
  
  home:
    name: ${PROJECT_NAME}_home
  
  postgres_data:
    name: ${PROJECT_NAME}_postgres_data
  
  mysql_data:
    name: ${PROJECT_NAME}_mysql_data
  
  redis_data:
    name: ${PROJECT_NAME}_redis_data

# =============================================================================
# Services
# =============================================================================
services:
  
  # ===========================================================================
  # Socket Proxy - Secure Docker Socket Access
  # ===========================================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ${PROJECT_NAME}_socket_proxy
    restart: unless-stopped
    
    environment:
      # Allowed operations
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - PING=1
      - SERVICES=0
      - TASKS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SWARM=0
      # Logging
      - LOG_LEVEL=info
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    networks:
      - project_net
    
    security_opt:
      - no-new-privileges:true
    
    logging: *logging
    
    labels:
      - "project=${PROJECT_NAME}"
      - "service=socket-proxy"
  
  # ===========================================================================
  # DevBox - Main Development Environment
  # ===========================================================================
  devbox:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        USERNAME: dev
        UID: 1000
        GID: 1000
    
    image: ${PROJECT_NAME}/devbox:latest
    container_name: ${PROJECT_NAME}_devbox
    hostname: ${PROJECT_NAME}-dev
    restart: unless-stopped
    
    environment:
      <<: *common-env
      
      # Docker (via socket-proxy)
      DOCKER_HOST: tcp://socket-proxy:2375
      
      # Database connections (if enabled)
      PGHOST: ${POSTGRES_ENABLED:-false}
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-devuser}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-devdb}
      
      MYSQL_HOST: ${MYSQL_ENABLED:-false}
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-devdb}
      
      REDIS_HOST: ${REDIS_ENABLED:-false}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # API Key for authentication
      API_KEY: ${API_KEY}
    
    networks:
      - project_net
      - edge
    
    depends_on:
      - socket-proxy
    
    user: "1000:1000"
    working_dir: /workspace
    
    # Security
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # للمنافذ < 1024
    
    tmpfs:
      - /tmp:size=512m,exec,mode=1777
      - /var/tmp:size=256m,mode=1777
      - /run:size=64m,mode=755
    
    volumes:
      - workspace:/workspace
      - home:/home/dev
      # Shared cache directories (optional)
      - ${PWD}/.cache/pip:/home/dev/.cache/pip
      - ${PWD}/.cache/npm:/home/dev/.npm
      - ${PWD}/.cache/composer:/home/dev/.composer
    
    ports:
      - "${SSH_PORT}:22"
    
    deploy:
      resources:
        limits: *resources
        reservations:
          cpus: '0.5'
          memory: 512M
    
    logging: *logging
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "traefik.enable=true"
      - "project=${PROJECT_NAME}"
      
      # ========== Code Server ==========
      - "traefik.http.routers.${PROJECT_NAME}-code.rule=Host(`${DOMAIN}`) && PathPrefix(`/code/${PROJECT_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-code.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-code.tls.certresolver=le"
      
      # Middlewares for code-server
      - "traefik.http.routers.${PROJECT_NAME}-code.middlewares=${PROJECT_NAME}-code-strip,${PROJECT_NAME}-ratelimit,security"
      - "traefik.http.middlewares.${PROJECT_NAME}-code-strip.stripprefix.prefixes=/code/${PROJECT_NAME}"
      
      # Code server service
      - "traefik.http.services.${PROJECT_NAME}-code.loadbalancer.server.port=8443"
      - "traefik.http.services.${PROJECT_NAME}-code.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.${PROJECT_NAME}-code.loadbalancer.healthcheck.interval=30s"
      
      # ========== Exec API ==========
      - "traefik.http.routers.${PROJECT_NAME}-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/${PROJECT_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-api.tls.certresolver=le"
      
      # Middlewares for API
      - "traefik.http.routers.${PROJECT_NAME}-api.middlewares=${PROJECT_NAME}-api-strip,${PROJECT_NAME}-ratelimit,${PROJECT_NAME}-auth,security"
      - "traefik.http.middlewares.${PROJECT_NAME}-api-strip.stripprefix.prefixes=/api/${PROJECT_NAME}"
      
      # API authentication
      - "traefik.http.middlewares.${PROJECT_NAME}-auth.headers.customrequestheaders.X-API-Key=${API_KEY}"
      
      # API service
      - "traefik.http.services.${PROJECT_NAME}-api.loadbalancer.server.port=8000"
      - "traefik.http.services.${PROJECT_NAME}-api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.${PROJECT_NAME}-api.loadbalancer.healthcheck.interval=30s"
      
      # ========== Rate Limiting ==========
      - "traefik.http.middlewares.${PROJECT_NAME}-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.${PROJECT_NAME}-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.${PROJECT_NAME}-ratelimit.ratelimit.burst=50"
  
  # ===========================================================================
  # PostgreSQL (Optional)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}_postgres
    restart: unless-stopped
    
    profiles:
      - with-postgres
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    
    networks:
      - project_net
    
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    
    logging: *logging
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    labels:
      - "project=${PROJECT_NAME}"
      - "service=postgres"
  
  # ===========================================================================
  # MySQL (Optional)
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}_mysql
    restart: unless-stopped
    
    profiles:
      - with-mysql
    
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-devdb}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    
    networks:
      - project_net
    
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    
    logging: *logging
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    labels:
      - "project=${PROJECT_NAME}"
      - "service=mysql"
  
  # ===========================================================================
  # Redis (Optional)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: unless-stopped
    
    profiles:
      - with-redis
    
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    
    volumes:
      - redis_data:/data
    
    networks:
      - project_net
    
    security_opt:
      - no-new-privileges:true
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    logging: *logging
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    labels:
      - "project=${PROJECT_NAME}"
      - "service=redis"
